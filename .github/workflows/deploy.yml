name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ehitelrc/harmony_service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s' "${{ secrets.SSH_KEY }}" | sed 's/\\r//g; s/\\n/\n/g' > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          grep -q "BEGIN .*PRIVATE KEY" "${HOME}/.ssh/deploy_key" || (echo "::error::SSH_KEY secret is not a valid private key" && exit 1)

      - name: SSH and deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ env.HOME }}/.ssh/deploy_key
          script: |
            cd /opt/harmony
            sudo docker compose pull harmony_service
            sudo docker compose up harmony_service -d
