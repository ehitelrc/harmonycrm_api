name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ehitelrc/harmony_service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY_PATH: ${{ runner.temp }}/deploy_key
    steps:
      - name: Prepare SSH private key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s' "${SSH_KEY}" > "${DEPLOY_KEY_PATH}"
          if grep -q '\\n' "${DEPLOY_KEY_PATH}"; then
            perl -pe 's/\r//g; s/\\n/\n/g' "${DEPLOY_KEY_PATH}" > "${DEPLOY_KEY_PATH}.normalized"
          else
            tr -d '\r' < "${DEPLOY_KEY_PATH}" > "${DEPLOY_KEY_PATH}.normalized"
          fi
          mv "${DEPLOY_KEY_PATH}.normalized" "${DEPLOY_KEY_PATH}"
          chmod 600 "${DEPLOY_KEY_PATH}"
          grep -Eq '^-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----$' "${DEPLOY_KEY_PATH}" || (echo "::error::SSH_KEY secret is not a valid private key" && exit 1)

      - name: SSH and deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ env.DEPLOY_KEY_PATH }}
          script: |
            cd /opt/harmony
            sudo docker compose pull harmony_service
            sudo docker compose up harmony_service -d
